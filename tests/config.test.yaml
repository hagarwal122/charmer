# Smoke-test pool: every deployment points at the stub provider. Mirrors config.yaml's router settings,
# with short cooldowns and timeouts. Model strings carry "@<id>" so each deployment has its own counters.
x-stub: &stub { api_base: os.environ/STUB_BASE, api_key: os.environ/STUB_KEY, weight: 10, order: 1, timeout: 4, stream_timeout: 4, cooldown_time: 5 }

model_list:
  - { model_name: g-two, litellm_params: { <<: *stub, model: openai/ok-a@two-a }, model_info: { id: two-a, account: stub } }
  - { model_name: g-two, litellm_params: { <<: *stub, model: openai/ok-b@two-b }, model_info: { id: two-b, account: stub } }
  - { model_name: g-fail, litellm_params: { <<: *stub, model: openai/rl-429@fail-rl }, model_info: { id: fail-rl, account: stub } }
  - { model_name: g-fail, litellm_params: { <<: *stub, model: openai/ok-a@fail-ok }, model_info: { id: fail-ok, account: stub } }
  - { model_name: g-dry, litellm_params: { <<: *stub, model: openai/rl-429@dry-rl }, model_info: { id: dry-rl, account: stub } }
  - { model_name: g-dry, litellm_params: { <<: *stub, model: openai/err-500@dry-500 }, model_info: { id: dry-500, account: stub } }
  - { model_name: g-rpm, litellm_params: { <<: *stub, model: openai/ok-a@rpm-a }, model_info: { id: rpm-a, account: stub } }
  - { model_name: g-rpm, litellm_params: { <<: *stub, model: openai/ok-b@rpm-b }, model_info: { id: rpm-b, account: stub } }
  - { model_name: g-sticky, litellm_params: { <<: *stub, model: openai/rl-429-once@s1 }, model_info: { id: s1, account: stub } }
  - { model_name: g-sticky, litellm_params: { <<: *stub, model: openai/ok-b@s2 }, model_info: { id: s2, account: stub } }
