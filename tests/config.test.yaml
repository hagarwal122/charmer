  - { model_name: g-paid, litellm_params: { <<: *stub, model: openai/pay-402@gm1 }, model_info: { id: gm1, account: gemini } }
  - { model_name: g-paid, litellm_params: { <<: *stub, model: openai/ok-a@paid-ok }, model_info: { id: paid-ok, account: stub } }
