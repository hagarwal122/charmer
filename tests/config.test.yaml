  - { model_name: g-cf, litellm_params: { <<: *stub, model: openai/ok-b@cf-ok }, model_info: { id: cf-ok, account: stub } }
  - { model_name: g-cf-only, litellm_params: { <<: *stub, model: openai/cf-chat@cf2 }, model_info: { id: cf2, account: cloudflare } }
