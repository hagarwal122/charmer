  - { model_name: g-strict, litellm_params: { <<: *stub, model: openai/strict@st1 }, model_info: { id: st1, account: stub } }
  - { model_name: g-strict-cf, litellm_params: { <<: *stub, model: openai/strict-null@st2 }, model_info: { id: st2, account: cloudflare } }
  - { model_name: g-slow, litellm_params: { <<: *stub, model: openai/slow@slow1 }, model_info: { id: slow1, account: stub } }
  - { model_name: g-slow, litellm_params: { <<: *stub, model: openai/ok-a@slow-ok }, model_info: { id: slow-ok, account: stub } }

router_settings:
  routing_strategy: simple-shuffle
  optional_pre_call_checks: [session_affinity]
  deployment_affinity_ttl_seconds: 1800
  num_retries: 2
  retry_policy:
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
    AuthenticationErrorRetries: 1
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 0
    TimeoutErrorAllowedFails: 3
    InternalServerErrorAllowedFails: 3
  cooldown_time: 5

litellm_settings:
  callbacks: [prometheus, charmer_plugin.instance]
  enable_post_custom_auth_checks: true
  telemetry: false
  drop_params: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  custom_auth: charmer_auth.user_api_key_auth
  custom_auth_run_common_checks: true
  allow_client_side_credentials: false
  background_health_checks: false
